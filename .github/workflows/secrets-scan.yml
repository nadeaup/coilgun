# Secrets scan (gitleaks 8.30.1). Replaces the bot "Secrets exposure scan" routine for this repo.
# - push to the default branch / PRs: scans only the new commits
# - weekly schedule + manual run: scans full history of every branch and tag
# Shared config is embedded below (identical in every nadeaup repo). Known/accepted
# findings are baselined by gitleaks fingerprint; you can also add lines to a
# root .gitleaksignore. Output is --redact (secret values are never printed).
name: Secrets scan
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "27 14 * * 1"   # Mondays ~9:27 AM ET, full history
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Write shared config + baseline
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" <<'GITLEAKS_TOML'
          # Shared gitleaks config for nadeaup repos (secrets-scan workflow).
          # Default ruleset + narrow, RULE-SCOPED exceptions for keys that are public by design.
          # Never add a top-level [[allowlists]] with `paths`: in gitleaks 8.x that skips the
          # matching files for EVERY rule (the src/ blind spot fixed in CEV-OS PR #166).
          title = "nadeaup shared gitleaks config"

          [extend]
          useDefault = true

          # reCAPTCHA *site* keys (public). Secret keys share the format, so only when the
          # line names it a site key. No `paths` (global line-regex allowlist only).
          [[allowlists]]
          description = "reCAPTCHA site keys (public)"
          condition = "AND"
          regexTarget = "line"
          regexes = ['''(?i)site[_\-]?key[^\n]{0,60}\b6L[0-9A-Za-z_\-]{38}\b''']

          # Firebase *web client* API keys (AIza...) in client source / Firebase client config.
          # Scoped to the rules that match them; the same file is still scanned for all other rules.
          [[rules]]
          id = "gcp-api-key"
          [[rules.allowlists]]
          description = "Firebase web client API keys in client source / Firebase config"
          condition = "AND"
          regexTarget = "secret"
          regexes = ['''^AIza[0-9A-Za-z_\-]{35}$''']
          paths = [
            '''(^|/)src/''',
            '''(?i)(^|/)firebase(Config|\.config|-config|_config|-applet-config)?\.(js|jsx|ts|tsx|mjs|cjs|json)$''',
          ]

          [[rules]]
          id = "generic-api-key"
          [[rules.allowlists]]
          description = "Firebase web client API keys written as apiKey/API_KEY assignments"
          condition = "AND"
          regexTarget = "secret"
          regexes = ['''^AIza[0-9A-Za-z_\-]{35}$''']
          paths = [
            '''(^|/)src/''',
            '''(?i)(^|/)firebase(Config|\.config|-config|_config|-applet-config)?\.(js|jsx|ts|tsx|mjs|cjs|json)$''',
          ]
          # Values that are env-var / constant NAMES (env var names in config objects)
          # rather than secrets: all-caps identifiers with underscores.
          [[rules.allowlists]]
          description = "UPPER_SNAKE identifiers (env var names), not secret values"
          regexTarget = "secret"
          regexes = ['''^[A-Z][A-Z0-9]*(_[A-Z0-9]+)+$''']
          # Referrer-restricted ArcGIS browser key (AAPT...) only in built SPA bundles.
          [[rules.allowlists]]
          description = "ArcGIS Location Platform browser key in built SPA bundles"
          condition = "AND"
          regexTarget = "secret"
          regexes = ['''^AAPT[0-9A-Za-z_\-]{40,}$''']
          paths = [
            '''(^|/)dist/.*\.js$''',
            '''(^|/)assets/[^/]+\.js$''',
          ]
          GITLEAKS_TOML
          cat > "$RUNNER_TEMP/baseline.gitleaksignore" <<'GITLEAKS_BASELINE'
          # (no known findings)
          GITLEAKS_BASELINE
          if [ -f .gitleaksignore ]; then cat .gitleaksignore >> "$RUNNER_TEMP/baseline.gitleaksignore"; fi
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          RANGE="--all"
          if [ "$EVENT" = "pull_request" ]; then RANGE="$PR_BASE..$PR_HEAD"; fi
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then RANGE="$BEFORE..$AFTER"; fi
          echo "scan range: $RANGE"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose \
            --config "$RUNNER_TEMP/gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/baseline.gitleaksignore" \
            --log-opts="$RANGE"
